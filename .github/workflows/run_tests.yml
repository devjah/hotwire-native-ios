name: Run tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image's default Xcode, not the newest one: a newer Xcode can land on
      # the image before its iOS simulator runtime does, leaving no simulator to
      # test on. Device names change from image to image too, so the test runs
      # on whichever iPhone simulator is there.
      - name: Run Tests
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if ".iOS-" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          xcodebuild test -scheme HotwireNative -destination "id=$udid" | xcpretty && exit ${PIPESTATUS[0]}
